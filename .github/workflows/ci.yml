name: CI

# Protocol §49: checkout → frozen install → lint → typecheck → unit → database → RLS →
# security → build → dependency audit → secret scan → SAST (codeql.yml) → result.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CDF_ENVIRONMENT: test

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - name: Sentry stays server-side only (CDF-81)
        run: node scripts/security/check-sentry-boundary.mjs
      - run: pnpm typecheck
      - run: pnpm test

  database:
    name: Database, RLS and security tests (PostgreSQL 16 + compatibility shim)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["54322:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate throwaway login-role passwords (never stored)
        run: |
          for v in CDF_BFF_DB_PASSWORD CDF_PORTAL_DB_PASSWORD; do
            p=$(openssl rand -hex 24); echo "::add-mask::$p"; echo "$v=$p" >> "$GITHUB_ENV"
          done
          echo "CDF_ADMIN_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"
      - run: pnpm db:reset
      - run: pnpm test:db
      - name: Access-model snapshot is up to date
        run: |
          pnpm db:policies
          git diff --exit-code -- infrastructure/supabase/policies/policy-snapshot.md \
            || { echo "::error::Access model changed. Run pnpm db:reset && pnpm db:policies and commit the snapshot."; exit 1; }

  e2e:
    name: End-to-end and accessibility (Playwright)
    runs-on: ubuntu-latest
    needs: database
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["54322:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate throwaway secrets for this run (never stored)
        run: |
          for v in CDF_BFF_DB_PASSWORD CDF_PORTAL_DB_PASSWORD CDF_REPORT_SECRET_PEPPER CDF_RATE_LIMIT_SALT CDF_DEV_IDENTITY_SECRET CDF_DEV_PASSWORD; do
            p=$(openssl rand -hex 24); echo "::add-mask::$p"; echo "$v=$p" >> "$GITHUB_ENV"
          done
          echo "CDF_ADMIN_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"
          echo "CDF_IDENTITY_PROVIDER=local-dev" >> "$GITHUB_ENV"
          # CDF-81: a synthetic, never-resolving DSN, so the build and the bundle scan prove the
          # server-only DSN does not reach any client bundle, and the apps start with Sentry on.
          echo "SENTRY_DSN=https://$(openssl rand -hex 16)@o0.ingest.example.test/1" >> "$GITHUB_ENV"
      - run: pnpm db:reset
      - name: App connection strings
        run: |
          echo "CDF_BFF_DATABASE_URL=postgresql://cdf_bff:${CDF_BFF_DB_PASSWORD}@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"
          echo "CDF_PORTAL_DATABASE_URL=postgresql://cdf_portal:${CDF_PORTAL_DB_PASSWORD}@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: set -o pipefail; pnpm test:e2e 2>&1 | tee playwright-e2e.log
      - run: set -o pipefail; pnpm test:a11y 2>&1 | tee playwright-a11y.log
      - name: Surface Playwright output as annotations (job logs are not downloadable from every client)
        if: failure()
        run: |
          for f in playwright-e2e.log playwright-a11y.log; do
            [ -f "$f" ] || continue
            grep -nE '\[WebServer\]|Error|error|✘|failed|Exit code|Timed out' "$f" | head -n 200 > filtered.log || true
            [ -s filtered.log ] || tail -n 50 "$f" > filtered.log
            split -l 25 -d filtered.log chunk_
            for c in chunk_*; do
              msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$c" | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=Playwright output ($f, ${c#chunk_})::${msg}"
            done
            rm -f chunk_* filtered.log
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  supabase:
    name: Supabase compatibility (Supabase CLI local stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          # Exact version: "latest" costs an unauthenticated GitHub API lookup that hits the rate limit (CDF-86).
          # Bumped by hand in ci.yml and hosted-dev.yml together (CONTRIBUTING.md, Dependencies).
          version: 2.120.0
      - run: pnpm install --frozen-lockfile
      - run: supabase start --workdir infrastructure
      - name: Generate throwaway login-role passwords (never stored)
        run: |
          for v in CDF_BFF_DB_PASSWORD CDF_PORTAL_DB_PASSWORD; do
            p=$(openssl rand -hex 24); echo "::add-mask::$p"; echo "$v=$p" >> "$GITHUB_ENV"
          done
          echo "CDF_ADMIN_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"
      - run: pnpm db:reset
        env:
          CDF_DB_MODE: supabase
      - run: pnpm test:db

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:deps
      - name: SBOM
        run: pnpm sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: compliance/evidence/sbom.json

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
