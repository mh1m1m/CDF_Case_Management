name: Hosted DEV (Supabase)

# CDF-32 / CEOM §11: the hosted DEV database (Supabase project blycdqjphsxvyiuoommv, "cdf-case-dev")
# changes only from Git. This workflow applies infrastructure/supabase/migrations with the Supabase
# CLI, seeds the synthetic demo data once (later only the users, sectors and reporter messages added to
# the seed), and runs the database, RLS and security suites against DEV. It runs on pushes to the branch
# named below that touch the database or the tests, and manually (workflow_dispatch) once the file
# exists on the default branch, because GitHub resolves manual dispatch against main. It never resets,
# drops or truncates anything on the hosted project.
#
# The CLI connects with --db-url through the Supavisor session pooler (IPv4; the direct database host
# is IPv6-only, which GitHub-hosted runners cannot reach), so no Supabase access token is needed.
#
# Secrets: the job runs in the GitHub environment "Subapase" (spelled that way in Settings → Environments), so it reads that
# environment's secrets and variables first and falls back to repository secrets of the same name
# (Settings → Secrets and variables → Actions). The environment's protection rules (required reviewers,
# allowed branches) apply to every run. Values never appear in logs; every secret-derived value is masked.
#   SUPABASE_DB_PASSWORD    DEV project database password (Project Settings → Database)
#   CDF_BFF_DB_PASSWORD     optional: stable password for the cdf_bff login role (same value as in Vercel)
#   CDF_PORTAL_DB_PASSWORD  optional: stable password for the cdf_portal login role (same value as in Vercel)
# Without the optional two, throwaway passwords are generated for the test run and set on the roles.
# Variable (optional, environment or repository): SUPABASE_POOLER_HOST, the session-pooler host shown under
# Dashboard → Connect → Session pooler, if the probe of the two regional pooler hosts below fails.

on:
  push:
    branches: [feature/CDF-32-hosted-dev]
    paths:
      - .github/workflows/hosted-dev.yml
      - infrastructure/supabase/**
      - tests/**
      - scripts/db/**
  workflow_dispatch:
    inputs:
      seed:
        description: Seed synthetic data (all of it into an empty DEV, afterwards only the users, sectors and reporter messages added to the seed)
        type: boolean
        default: true
      test:
        description: Run the database, RLS and security suites against DEV
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hosted-dev
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: blycdqjphsxvyiuoommv
  SUPABASE_REGION: ap-northeast-1

jobs:
  hosted-dev:
    name: Migrate, seed and test DEV (part ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Every statement of the suites is one round trip from the runner to the Tokyo pooler, and a round trip took
    # 0.108 to 0.176 s on DEV, depending on the run. Counted on a local database, the 1,344 tests of
    # main 483c321 (migration 2120) make 242,979 round trips: 441 to 713 minutes in one job at 0.109 to
    # 0.176 s, and GitHub-hosted jobs stop at 360. So the suites run as four Vitest shards (two until a shard came
    # within about 5,000 round trips of 300 minutes at 0.155 s, three until one came within 18 minutes of the
    # limit at 0.176 s), jobs of the same run one after the other, each with its own report and its own limit.
    # Never side by side: two sessions running the suites on DEV at once wait on each other at the audit ledger's
    # chain lock and deadlock (compliance/evidence/HOSTED_DEV_VALIDATION.md §12). Each job repeats the migration,
    # seed and drift steps, which find nothing more to do after the first.
    timeout-minutes: 330
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        # A dispatch without the suites migrates once.
        shard: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.test) && '[1, 2, 3, 4]' || '[1]') }}
    environment: Subapase
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    services:
      # Reference database for the drift check, built from Git alone (compatibility shim); never DEV.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["54322:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          # Exact version: "latest" costs an unauthenticated GitHub API lookup that hits the rate limit (CDF-86).
          # Bumped by hand in ci.yml and hosted-dev.yml together (CONTRIBUTING.md, Dependencies).
          version: 2.120.0

      - name: Check the required secret exists (its value is never printed)
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is set neither in the Subapase environment nor as a repository secret"; exit 1
          fi

      - name: Database connection string (session pooler, IPv4; values masked)
        run: |
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          fail() { echo "::error::SUPABASE_DB_PASSWORD $1"; exit 1; }
          # Accept what people paste and report which form it was (never the value): the bare password, the
          # connection string from Dashboard → Connect (its password part is used), the [ ] of that string's
          # placeholder, surrounding quotes or spaces, a trailing line break.
          pw="${SUPABASE_DB_PASSWORD%%[$'\r\n']*}"
          pw="$(printf '%s' "$pw" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          form="a bare value"
          case "$pw" in
            *YOUR-PASSWORD*) fail "still contains the [YOUR-PASSWORD] placeholder of the Connect dialog" ;;
            postgres://* | postgresql://*)
              case "$pw" in *"$SUPABASE_PROJECT_REF"*) ;; *) fail "is a connection string for a different Supabase project" ;; esac
              pw=$(python3 -c 'import sys,urllib.parse;c=sys.argv[1].split("://",1)[1].rpartition("@")[0];print(urllib.parse.unquote(c.partition(":")[2]))' "$pw")
              form="a connection string (its password part is used)" ;;
          esac
          case "$pw" in \[*\]) pw="${pw:1:${#pw}-2}"; form="$form, square brackets removed" ;; esac
          case "$pw" in \"*\" | \'*\') pw="${pw:1:${#pw}-2}"; form="$form, quotes removed" ;; esac
          case "$pw" in
            eyJ*) fail "is an API key (JWT), not the database password" ;;
            sb_secret_* | sb_publishable_*) fail "is an API key (sb_secret_ / sb_publishable_), not the database password" ;;
            sbp_*) fail "is a personal access token, not the database password" ;;
          esac
          [ -n "$pw" ] || fail "is empty"
          echo "::add-mask::$pw"
          echo "::notice::SUPABASE_DB_PASSWORD was read as $form"
          enc=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$pw")
          echo "::add-mask::$enc"
          # Diagnostics go out as annotations: job logs are not readable from the cloud session.
          echo "::notice::$(psql --version 2>&1 || echo 'psql is not installed on the runner')"
          user="postgres.${SUPABASE_PROJECT_REF}"
          host=""
          # Run 37649873035 showed this project's tenant lives on aws-0 (aws-1 answers "tenant not found").
          for candidate in "${{ vars.SUPABASE_POOLER_HOST }}" "aws-0-${SUPABASE_REGION}.pooler.supabase.com" "aws-1-${SUPABASE_REGION}.pooler.supabase.com"; do
            [ -n "$candidate" ] || continue
            getent hosts "$candidate" >/dev/null || echo "::warning::$candidate does not resolve"
            # libpq error text names host, port and user, never the password (masked anyway).
            if err=$(PGCONNECT_TIMEOUT=15 psql "postgresql://${user}:${enc}@${candidate}:5432/postgres" --no-psqlrc -qtAX -c "select 1" 2>&1 >/dev/null); then
              host="$candidate"; break
            fi
            echo "::warning::$candidate: $(printf '%s' "$err" | tr '\n' ' ')"
          done
          if [ -z "$host" ]; then
            echo "::error::No session-pooler host accepted the connection (see the messages above: 'Tenant or user not found' means the host is wrong, set the variable SUPABASE_POOLER_HOST (Subapase environment or repository) from Dashboard → Connect → Session pooler; 'password authentication failed' means the secret SUPABASE_DB_PASSWORD is not the database password)."
            exit 1
          fi
          echo "Session pooler: $host"
          echo "CDF_POOLER_HOST=$host" >> "$GITHUB_ENV"
          echo "CDF_ADMIN_DATABASE_URL=postgresql://${user}:${enc}@${host}:5432/postgres" >> "$GITHUB_ENV"

      - name: Migration history before
        run: supabase --workdir infrastructure migration list --db-url "$CDF_ADMIN_DATABASE_URL"

      - name: Apply pending Git migrations (supabase db push)
        # --include-all: migration numbers are reserved per work stream, so a file can reach main after a
        # higher-numbered one was applied here (1300–1330 arrived after 1500 on 2026-10-10). The drift check
        # below proves DEV still equals a database built from Git in file order.
        run: supabase --workdir infrastructure db push --db-url "$CDF_ADMIN_DATABASE_URL" --include-all --yes

      - name: Migration history after
        run: supabase --workdir infrastructure migration list --db-url "$CDF_ADMIN_DATABASE_URL"

      - name: Seed synthetic data (only while iam.user_profile is empty)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.seed }}
        run: |
          n=$(psql "$CDF_ADMIN_DATABASE_URL" --no-psqlrc -qtAX -c "select count(*) from iam.user_profile")
          if [ "$n" != "0" ]; then echo "DEV already holds $n synthetic users; seed skipped"; exit 0; fi
          for f in infrastructure/supabase/seed/*.sql; do
            echo "→ $f"
            psql "$CDF_ADMIN_DATABASE_URL" --no-psqlrc --quiet -v ON_ERROR_STOP=1 --single-transaction -f "$f"
          done

      - name: Drift check (DEV schema and reference data equal a database built from Git)
        env:
          CDF_ENVIRONMENT: test
          REFERENCE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          # reset.mjs only ever targets a loopback host: here the service container above.
          CDF_ADMIN_DATABASE_URL="$REFERENCE_URL" node scripts/db/reset.mjs > /dev/null
          drift=0
          for kind in schema data; do
            psql "$REFERENCE_URL" --no-psqlrc -qtAX -F ' | ' -f "scripts/db/fingerprint-$kind.sql" > "git-$kind.txt"
            psql "$CDF_ADMIN_DATABASE_URL" --no-psqlrc -qtAX -F ' | ' -f "scripts/db/fingerprint-$kind.sql" > "dev-$kind.txt"
            echo "::notice::Drift check ($kind): $(wc -l < "dev-$kind.txt") rows on DEV, $(wc -l < "git-$kind.txt") from Git"
            # Rows are object kinds, counts and md5 hashes; they carry no data values.
            if ! diff -q "git-$kind.txt" "dev-$kind.txt" > /dev/null; then
              drift=1
              diff "git-$kind.txt" "dev-$kind.txt" | grep '^[<>]' | head -n 10 | while IFS= read -r line; do
                echo "::error::$kind drift (< Git, > DEV): $line"
              done
            fi
          done
          [ "$drift" = 0 ] || { echo "::error::DEV differs from a database built from Git"; exit 1; }
          echo "::notice::No drift: DEV schema and reference data equal a database built from Git"

      - name: Synthetic users added to the seed since DEV was seeded (insert only)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.seed }}
        env:
          REFERENCE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          # The seed files run only while DEV is empty, because they are not idempotent (02 onwards act through
          # the api.* commands). Users added to 01_synthetic_users.sql later therefore never reached DEV: run
          # 38058158699 lacked the records and legal actors of CDF-69/CDF-73, and the 86 tests acting as them
          # failed. So the users of the database the drift check has just built from Git that DEV lacks are
          # inserted here, with their role assignments. Nothing on DEV is updated or deleted, and the drift check
          # has just shown both tables identical, column order included. An assignment is copied with every column
          # but id (DEV gives it its own), as the database built from Git lists them, so a column that a later
          # migration adds is carried too and the export always matches the table it is loaded into (drift
          # record 4.11).
          cols=$(psql "$REFERENCE_URL" --no-psqlrc -qtAX -v ON_ERROR_STOP=1 -c "select string_agg(quote_ident(attname), ', ' order by attnum) from pg_attribute where attrelid = 'iam.user_role_assignment'::regclass and attnum > 0 and not attisdropped and attgenerated = '' and attname <> 'id'")
          psql "$REFERENCE_URL" --no-psqlrc -qtAX -c "\copy (select * from iam.user_profile) to 'seed-users.csv' csv"
          psql "$REFERENCE_URL" --no-psqlrc -qtAX -c "\copy (select $cols from iam.user_role_assignment) to 'seed-roles.csv' csv"
          added=$(psql "$CDF_ADMIN_DATABASE_URL" --no-psqlrc -qtAX -v ON_ERROR_STOP=1 -v cols="$cols" <<'SQL'
          begin;
          create temp table seed_user (like iam.user_profile) on commit drop;
          \copy seed_user from 'seed-users.csv' csv
          create temp table seed_role on commit drop as select :cols from iam.user_role_assignment with no data;
          \copy seed_role from 'seed-roles.csv' csv
          create temp table added (id uuid primary key) on commit drop;
          with ins as (
            insert into iam.user_profile
            select s.* from seed_user s where not exists (select 1 from iam.user_profile u where u.id = s.id)
            returning id
          )
          insert into added select id from ins;
          insert into iam.user_role_assignment (:cols)
          select * from seed_role where user_id in (select id from added);
          select count(*) || ' ' || coalesce(string_agg(u.email, ', ' order by u.email), '') from added a join iam.user_profile u using (id);
          commit;
          SQL
          )
          rm -f seed-users.csv seed-roles.csv
          if [ "${added%% *}" = 0 ]; then
            echo "::notice::Seed users: DEV already has every synthetic user of the seed in Git"
          else
            echo "::notice::Seed users: ${added%% *} synthetic users of the seed in Git added to DEV (${added#* })"
          fi

      - name: Synthetic sectors added to the seed since DEV was seeded (insert only)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.seed }}
        env:
          REFERENCE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          # PR #56 (migration 1880) added two synthetic sectors and four sector positions to the seed
          # (20_synthetic_rebase_users.sql). Its users reach DEV in the step above, but DEV was seeded before the
          # sectors existed, so the direct-referral tests acting as the Operations preparer and head would fail
          # (drift record 4.8). So the sectors of the database the drift check has just built from Git that DEV
          # lacks are inserted here, with their positions. Nothing on DEV is updated or deleted; a sector whose code
          # DEV already uses under another id stops the step, so a difference is never skipped silently. A position
          # is copied with every column but id, as the database built from Git lists them: run 40324135511 stopped
          # here when 2128 added end_reference to iam.sector_membership and the column list written in this step
          # lacked it (drift record 4.11), and a column that a later migration adds is now carried too.
          cols=$(psql "$REFERENCE_URL" --no-psqlrc -qtAX -v ON_ERROR_STOP=1 -c "select string_agg(quote_ident(attname), ', ' order by attnum) from pg_attribute where attrelid = 'iam.sector_membership'::regclass and attnum > 0 and not attisdropped and attgenerated = '' and attname <> 'id'")
          psql "$REFERENCE_URL" --no-psqlrc -qtAX -c "\copy (select * from iam.sector) to 'seed-sectors.csv' csv"
          psql "$REFERENCE_URL" --no-psqlrc -qtAX -c "\copy (select $cols from iam.sector_membership) to 'seed-positions.csv' csv"
          added=$(psql "$CDF_ADMIN_DATABASE_URL" --no-psqlrc -qtAX -v ON_ERROR_STOP=1 -v cols="$cols" <<'SQL'
          begin;
          create temp table seed_sector (like iam.sector) on commit drop;
          \copy seed_sector from 'seed-sectors.csv' csv
          create temp table seed_position on commit drop as select :cols from iam.sector_membership with no data;
          \copy seed_position from 'seed-positions.csv' csv
          create temp table added (id uuid primary key) on commit drop;
          with ins as (
            insert into iam.sector
            select s.* from seed_sector s where not exists (select 1 from iam.sector x where x.id = s.id)
            returning id
          )
          insert into added select id from ins;
          insert into iam.sector_membership (:cols)
          select * from seed_position where sector_id in (select id from added);
          select (select count(*) from added) || ' ' || (select count(*) from seed_position where sector_id in (select id from added))
            || ' ' || coalesce((select string_agg(x.code, ', ' order by x.code) from iam.sector x join added a using (id)), '');
          commit;
          SQL
          )
          rm -f seed-sectors.csv seed-positions.csv
          read -r sectors positions codes <<< "$added"
          if [ "$sectors" = 0 ]; then
            echo "::notice::Seed sectors: DEV already has every synthetic sector of the seed in Git"
          else
            echo "::notice::Seed sectors: $sectors synthetic sectors of the seed in Git added to DEV ($codes) with $positions positions"
          fi

      - name: Reporter messages added to the seed since DEV was seeded (insert only)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.seed }}
        run: |
          # PR #55 (DEC-06, migration 1840) added the reporter conversation on case A to 02_synthetic_cases.sql: a
          # portal follow-up on WB-SEED00000001 and the lead investigator's reply. DEV was seeded before that, and
          # the seed files never run again, so DEV had no message on that report and four tests of
          # tests/security/reporter-conversation.spec.ts failed in run 38334615873 (drift record 4.7). While that
          # report has no message, the same two messages are posted here through the same commands and as the same
          # users as in the seed, which also writes the same audit events. Nothing on DEV is updated or deleted.
          added=$(psql "$CDF_ADMIN_DATABASE_URL" --no-psqlrc -qtAX -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          create function pg_temp.act_as(p_email text)
          returns void
          language sql
          as $$
            select set_config('request.jwt.claims',
              json_build_object('sub', (select id from iam.user_profile where email = p_email), 'role', 'authenticated')::text, true);
          $$;
          create temp table topped_up (n int) on commit drop;
          do $$
          declare r1 uuid;
          begin
            select id into r1 from intake.report where report_ref = 'WB-SEED00000001';
            if r1 is null or exists (select 1 from intake.report_message where report_id = r1) then
              insert into topped_up values (0);
              return;
            end if;
            perform set_config('request.jwt.claims', '', true);
            perform public_api.post_reporter_message('WB-SEED00000001',
              encode(sha256(convert_to('unusable-seed-secret:WB-SEED00000001', 'UTF8')), 'hex'),
              'SYNTHETIC: As far as I recall, the duplicate invoices were approved in the same week.');
            perform pg_temp.act_as('lead@example.test');
            perform api.reply_to_reporter(r1, 'Thank you. Please share the approximate dates of the approvals if you can (synthetic).');
            insert into topped_up values (2);
          end $$;
          select n from topped_up;
          commit;
          SQL
          )
          if [ "$added" = 0 ]; then
            echo "::notice::Seed reporter messages: DEV already has the seed's conversation on WB-SEED00000001"
          else
            echo "::notice::Seed reporter messages: $added messages of the seed in Git posted on WB-SEED00000001"
          fi

      - name: Synthetic committee seats added to the seed since DEV was seeded (insert only)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.seed }}
        run: |
          # 30_synthetic_committee_seats.sql (migration 2030 section 4) is idempotent and insert-only, unlike the
          # seed files before it: it adds its demo users and their roles only when missing (the step above has
          # normally added them), and appoints each demo seat through api.appoint_committee_member only when its
          # appointment reference is new and nobody holds that seat. Nothing on DEV is updated or deleted; on a DEV
          # seeded just now it changes nothing. The suites end these seats inside each test's own transaction.
          psql "$CDF_ADMIN_DATABASE_URL" --no-psqlrc --quiet -v ON_ERROR_STOP=1 --single-transaction \
            -f infrastructure/supabase/seed/30_synthetic_committee_seats.sql
          n=$(psql "$CDF_ADMIN_DATABASE_URL" --no-psqlrc -qtAX -c "select count(*) from committee.membership where appointment_reference like 'SEED-DEMO-COMMITTEE-%' and ended_at is null")
          echo "::notice::Demo committee seats on DEV: $n of 7"

      - name: Synthetic continuity-workbook operator added to the seed since DEV was seeded (insert only)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.seed }}
        run: |
          # 31_synthetic_continuity_operators.sql (migration 2040, DEC-F30) is idempotent and insert-only: it authorizes
          # the synthetic case manager as the demo continuity-workbook operator only while no row carries its
          # reference, so it neither duplicates the row nor undoes a revocation made on DEV. On a DEV seeded just now it
          # changes nothing.
          psql "$CDF_ADMIN_DATABASE_URL" --no-psqlrc --quiet -v ON_ERROR_STOP=1 --single-transaction \
            -f infrastructure/supabase/seed/31_synthetic_continuity_operators.sql
          n=$(psql "$CDF_ADMIN_DATABASE_URL" --no-psqlrc -qtAX -c "select count(*) from exchange.bcp_continuity_operator where authorization_reference = 'BCP-AUTH-DEMO-0001' and revoked_at is null")
          echo "::notice::Demo continuity-workbook operator on DEV: $n of 1"

      - name: Login-role passwords for the test run (stable from secrets, else throwaway)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test }}
        env:
          CDF_BFF_DB_PASSWORD: ${{ secrets.CDF_BFF_DB_PASSWORD }}
          CDF_PORTAL_DB_PASSWORD: ${{ secrets.CDF_PORTAL_DB_PASSWORD }}
        run: |
          # The session pooler caches each role's password verifier and refuses the first login after a change
          # ("Validation secrets changed, cache updated", then "password authentication failed": the first
          # test to connect failed in runs 38054622850 and 38056162850). So a stable password that already logs
          # in stays as it is, and after any change a login is retried until the pooler accepts it, before the
          # suites open their first connection.
          login() {
            PGPASSWORD="$2" PGCONNECT_TIMEOUT=15 psql "postgresql://$1.${SUPABASE_PROJECT_REF}@${CDF_POOLER_HOST}:5432/postgres" \
              --no-psqlrc -qtAX -c "select 1" > /dev/null 2>&1
          }
          set_password() {
            printf "alter role %s password :'pw';\n" "$1" \
              | psql "$CDF_ADMIN_DATABASE_URL" --no-psqlrc --quiet -v ON_ERROR_STOP=1 -v pw="$2"
          }
          for pair in cdf_bff:CDF_BFF_DB_PASSWORD cdf_portal:CDF_PORTAL_DB_PASSWORD; do
            role=${pair%%:*}; var=${pair#*:}; p=${!var}
            if [ -n "$p" ]; then
              echo "::add-mask::$p"
              if login "$role" "$p" || { sleep 3; login "$role" "$p"; }; then
                echo "$role: the password from $var already works and is left unchanged"
              else
                echo "$role: setting the password from $var"
                set_password "$role" "$p"
              fi
            else
              p=$(openssl rand -hex 24)
              echo "::add-mask::$p"
              echo "$var is not set as a secret; a throwaway password is used for this run"
              set_password "$role" "$p"
            fi
            for attempt in 1 2 3 4 5 6; do
              if login "$role" "$p"; then break; fi
              if [ "$attempt" = 6 ]; then
                echo "::error::The session pooler did not accept the $role password in 6 attempts"
                exit 1
              fi
              sleep 5
            done
            enc=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$p")
            echo "::add-mask::$enc"
            prefix=${var%_DB_PASSWORD}
            echo "${prefix}_DATABASE_URL=postgresql://${role}.${SUPABASE_PROJECT_REF}:${enc}@${CDF_POOLER_HOST}:5432/postgres" >> "$GITHUB_ENV"
          done

      - run: pnpm install --frozen-lockfile
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test }}

      - name: Database, RLS and security suites against DEV (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        id: suites
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test }}
        env:
          CDF_ENVIRONMENT: test
          # Every statement crosses regions (runner to the Tokyo pooler); the CI default of 30 s per test is too short.
          # The longest tests make about 7,800 round trips, 18 to 20 minutes at the 0.1375 to 0.155 s per round trip
          # measured on DEV, so each test may take 30 minutes (HOSTED_DEV_VALIDATION.md §12).
          CDF_DB_TEST_TIMEOUT_MS: "1800000"
        # Vitest assigns each test file to one shard by a hash of its path, so a new file lands in one of them
        # without a list to maintain. The shard count is the matrix's job count, so the two cannot disagree.
        run: >-
          pnpm test:db --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=default --reporter=github-actions --reporter=json
          --outputFile.json=vitest-dev.json

      - name: Suite totals and failed tests as annotations (job logs are not readable from every client)
        if: ${{ always() && steps.suites.outcome != 'skipped' }}
        run: node scripts/db/vitest-annotations.mjs vitest-dev.json "DB suites on DEV, shard ${{ matrix.shard }} of ${{ strategy.job-total }}"

      - name: Evidence summary
        if: always()
        run: |
          {
            echo "## Hosted DEV run, part ${{ matrix.shard }}"
            echo "- Project: \`$SUPABASE_PROJECT_REF\` (cdf-case-dev)"
            echo "- Commit: \`$GITHUB_SHA\` on \`$GITHUB_REF_NAME\`"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Trigger: ${{ github.event_name }} · Seed: ${{ github.event_name != 'workflow_dispatch' || inputs.seed }} · Tests: ${{ github.event_name != 'workflow_dispatch' || inputs.test }} (shard ${{ matrix.shard }} of ${{ strategy.job-total }})"
            echo
            echo '```'
            if [ -n "$CDF_ADMIN_DATABASE_URL" ]; then
              supabase --workdir infrastructure migration list --db-url "$CDF_ADMIN_DATABASE_URL" 2>&1 || true
            else
              echo "no database connection was established"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
