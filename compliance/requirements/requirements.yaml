# One entry per requirement the reference implementation claims to address.
# `id` is this repository's own identifier. The CDF Compliance Master Workbook and
# architecture-requirement IDs live in Google Drive, which was CONNECTOR_UNAVAILABLE
# when this file was written (see CONNECTED_SYSTEMS_BASELINE.md); `external_ids`
# is left empty until they can be reconciled.
