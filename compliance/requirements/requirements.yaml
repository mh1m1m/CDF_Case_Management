      ]
    notes: "No migration (P12-6b-1, on api.bcp_import_batch_view as 2110 left it and the batch commands). Each form shows only where the view says its command would accept the caller now, and runs its api.* command in the caller's security context after the schema and the role permission (BCP_IMPORT to skip a row, run the dry run, submit, import or cancel; BCP_IMPORT_APPROVE to decide); a refusal is recorded as COMMAND_DENIED with the command and outcome only, and anyone the view refuses gets the same 404 as an id that names nothing (ACCESS_DENIED). The page shows the rows' metadata only, never a cell, the control sheet or a row about the reader, and counts over the rows it lists. An approver decides on the rows' metadata as submitted, which satisfies ADR-034 section 7 (coordinator ruling, F13); the preparer and offline recorders never decide and find nothing of it in My Work. A row refused while importing answers BCP_ROW_FAILED only; nothing is imported. How long staged rows are kept is SOURCE_REQUIRED (DEC-F31). A workbook reported lost (AMB-205) is never approved or imported, and a committee workbook is read-only: it goes on only through its official record (ADR-061), whose pages come later. A workbook id and a row id run to 64 characters and wrap anywhere. Not in this change (the P12-6b read-model migration): reporting a workbook lost (F2), uploading from the page (F3) and the template download (F12), resolutions other than skipping (F4) and lists of imports (F8); the continuity-operator registry's administration goes to P12-10, with 2160."

