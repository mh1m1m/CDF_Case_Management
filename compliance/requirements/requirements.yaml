        tests/security/my-work-phase12.spec.ts,
      ]
    notes: "No migration (P12-6b-1, on 2040's api.export_request_view and the 1930 and 2040 commands). Each form shows only where the view says its command would accept the caller now, and runs its api.* command in the caller's security context after the schema and the role permission (EXPORT_REQUEST to ask for, prepare, submit, send or cancel; EXPORT_APPROVE or EXPORT_SECOND_APPROVE to give a stage; RESTRICTED_CASE_AUTHORITY to consent); a refusal is recorded as COMMAND_DENIED with the command and outcome only. The content shows only on the preview page, which runs api.preview_export (EXPORT_PREVIEWED) once per visit and is never prefetched; the export's own page records nothing, and anyone it refuses gets the same 404 as an id that names nothing (ACCESS_DENIED). The request form narrows the command: an email export goes to external addresses only until internal recipients have their candidate read (F9), and an external address is typed twice (AMB-187). The requester is never offered a decision (DEC-F24, CDF-208). Every seeded rule, the restricted-case consent and the second approval are SOURCE_REQUIRED and say so. The stub mail relay is PRODUCTION_SUBSTITUTION_REQUIRED; a PDF or Excel export waits for a download read (F6); an email the relay did not accept shows its status only (F7). The request offers the catalogue's active purposes that the contracts' list names, so a purpose the catalogue gains later waits for that list (recorded debt; the database will judge a purpose's shape before the catalogue's Add purpose ships, P12-8). Not in this change (the P12-6b read-model migration): item kinds other than the case summary and internal recipients (F9), lists of exports (F8), the fact that no approver is eligible (F5, to P12-8), downloads (F6) and recording a delivery made another way (F7)."

