    notes: "No migration (P12-6a, on 2096's view). Each form shows only where A2's flag says its command would accept the caller now, and runs its api.* command in the caller's security context after the schema and the role permission (CORRECTIVE_ACTION_OWN to report, CORRECTIVE_ACTION_MANAGE to verify or reopen); a refusal is recorded as COMMAND_DENIED with the command and outcome only, and the audit events carry no note. The completion asks for a reference unless the policy in force accepts a note alone, and for a kind of evidence from the policy's list where it lists any. The history names only the reader ('by you') and, for the case team, the owner; notes are shown as A2 gives them (CDF-227). Outside the case team an action that may not move reads as paused, never why, and the page's answers carry ACTION_BLOCKED in place of each block code. My Work's ACTION_ASSIGNED and ACTION_RETURNED rows open the report, ACTION_TO_VERIFY the verification. Known limitation (ADR-058): a progress note that leaves the percentage of an action in progress unchanged is recorded while the action is held; the page never offers it, and 2170 closes it in the command (CDF-253). Not in this change (P12-6b): reassignment, the kind of owner, the due date and the waiver."

  - id: CDF-UX-024
    title: "An export is asked for from its case, then prepared, previewed, submitted, approved stage by stage, consented to by a restricted case's authority, sent or cancelled on pages of its own; each form only where its command would accept the caller now, and its content only on the preview, each opening recorded, in Arabic and English"
