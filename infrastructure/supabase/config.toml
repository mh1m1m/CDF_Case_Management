# Supabase CLI project. Run commands with: supabase --workdir infrastructure <command>
project_id = "cdf-case-platform"

[api]
enabled = true
port = 54321
# Application schemas are deliberately NOT exposed through PostgREST (ADR-001, ADR-003).
# Nothing application-owned lives in `public`.
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Self sign-up is disabled: users are provisioned (synthetic) by administrators/seed only.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
